<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">NeuroTrace product preview</title>
  <desc id="desc">A dark neural vision illustration with a scanning lens and luminous inference nodes.</desc>
  <defs>
